name: barcode_boss
description: "Bir mobil kasiyer/süpermarket simülatörü. Flutter + Flame ile."
publish_to: 'none'

# Semantic versioning: major.minor.patch+buildNumber
# v0.1.0 = Faz 0 setup tamamlandığında ilk runnable iskelet
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^2.5.0

  # --- Game engine ---
  flame: ^1.18.0
  flame_audio: ^2.10.0

  # --- Persistence (lokal save) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # --- i18n + number formatlama ---
  intl: ^0.19.0

  # --- Routing ---
  go_router: ^14.0.0

  # --- Firebase (Faz 4'te aktive edilir, paketler şimdiden tanıtılır) ---
  firebase_core: ^3.0.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0

  # --- Animation polish ---
  flutter_animate: ^4.5.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/products/
    - assets/images/ui/
    - assets/images/customers/
    - assets/images/backgrounds/
    - assets/audio/sfx/
    - assets/audio/music/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
